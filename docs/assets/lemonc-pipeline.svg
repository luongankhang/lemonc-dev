<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">LemonC compiler pipeline</title>
  <desc id="desc">Lemon source flows through lexer, parser, semantic analysis, AST optimizer and ownership/ARC analysis into the shared backend-neutral LemonIR, which feeds both a JVM backend that writes .class files directly and a C backend that emits C source for a native compiler.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff8ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="330" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">LemonC: one frontend, two backends</text>
  <text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526070">Shared LemonIR drives the JVM backend (direct .class bytecode) and the C backend (native gcc/clang output).</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="38" y="112" width="108" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="92" y="142" font-weight="700" fill="#172033">.lemon</text>
      <text x="92" y="164" fill="#607080">source</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="190" y="112" width="108" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="244" y="142" font-weight="700" fill="#172033">Lexer</text>
      <text x="244" y="164" fill="#607080">tokens</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="342" y="112" width="108" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="396" y="142" font-weight="700" fill="#172033">Parser</text>
      <text x="396" y="164" fill="#607080">AST</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="494" y="112" width="108" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="548" y="142" font-weight="700" fill="#172033">Semantic</text>
      <text x="548" y="164" fill="#607080">types + checks</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="646" y="112" width="108" height="72" rx="10" fill="#ffffff" stroke="#d6e4f0"/>
      <text x="700" y="142" font-weight="700" fill="#172033">Optimizer</text>
      <text x="700" y="164" fill="#607080">folding + ARC</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="798" y="112" width="170" height="72" rx="10" fill="#172033" stroke="#172033"/>
      <text x="883" y="142" font-weight="700" fill="#ffffff">LemonIR</text>
      <text x="883" y="164" fill="#cbd5e1">shared backend-neutral CFG</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="560" y="228" width="190" height="72" rx="10" fill="#ffffff" stroke="#7aa8ff"/>
      <text x="655" y="258" font-weight="700" fill="#172033">JVM backend</text>
      <text x="655" y="280" fill="#3b6fd4">direct bytecode → .class</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="860" y="228" width="190" height="72" rx="10" fill="#ffffff" stroke="#59a875"/>
      <text x="955" y="258" font-weight="700" fill="#172033">C backend</text>
      <text x="955" y="280" fill="#2f7a4e">C source → gcc/clang → native</text>
    </g>
  </g>
  <g stroke="#9fb4c8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 148h40"/>
    <path d="M182 141l8 7-8 7"/>
    <path d="M300 148h40"/>
    <path d="M334 141l8 7-8 7"/>
    <path d="M452 148h40"/>
    <path d="M486 141l8 7-8 7"/>
    <path d="M604 148h40"/>
    <path d="M638 141l8 7-8 7"/>
    <path d="M756 148h40"/>
    <path d="M790 141l8 7-8 7"/>
    <path d="M868 184v18"/>
    <path d="M860 198l8-8 8 8"/>
    <path d="M655 202v24"/>
    <path d="M645 220l10-8 10 8"/>
    <path d="M955 202v24"/>
    <path d="M945 220l10-8 10 8"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#526070">
    <text x="40" y="316">359 tests passing</text>
    <text x="196" y="316">94 examples</text>
    <text x="326" y="316">Java 21</text>
    <text x="430" y="316">no Jasmin, direct bytecode</text>
    <text x="660" y="316">MIT License</text>
  </g>
</svg>
